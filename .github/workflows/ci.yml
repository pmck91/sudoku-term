name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting and vet
        run: make check

      - name: Run tests with race detection
        run: make test

      - name: Build
        run: make build

      - name: Exercise the terminal application
        run: python3 scripts/pty_smoke.py ./sudoku

      - name: Package build artifact
        run: tar -czf sudoku-linux-amd64.tar.gz sudoku

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sudoku-linux-amd64
          path: sudoku-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
